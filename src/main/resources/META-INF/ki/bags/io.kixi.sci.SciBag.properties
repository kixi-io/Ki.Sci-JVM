# The type bag sci (io.kixi.sci.SciBag): read by Ki.Core's TypeBags
# instead of creating the bag, which is created when first referred to. TypeBags.manifestOf(bag) writes it.
name=sci
requires=
preload=true
type.Element=io.kixi.sci.Element element
type.Formula=io.kixi.sci.Formula formula
type.InChI=io.kixi.sci.InChI inchi
type.Isotope=io.kixi.sci.Isotope isotope
type.Molecule=io.kixi.sci.Molecule smiles
functions=element formula isotope mass molecule
constants=electronMass neutronMass protonMass speedOfLight
members=abridgedWeight abundance aromatic atomCount atomicWeight block bondCount charge components composition count counts element elements estimated formula group heavyAtomCount hill isotopes layers mainIsotope mass massNumber monoisotopicMass name neutrons nominal number period plus ringCount smiles standard stereo symbol text times weightRange weightUncertainty
